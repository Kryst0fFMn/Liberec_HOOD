<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fügnerka – procházka Libercem</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#b8c9d6;font-family:Georgia,"Times New Roman",serif}
  canvas{display:block}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(28,36,44,.78);z-index:10;color:#f3efe6;text-align:center;cursor:pointer}
  #ov div{max-width:30rem;padding:2rem;line-height:1.5}
  #ov h1{font-size:2.6rem;margin:0 0 .6rem;font-weight:normal;letter-spacing:.01em}
  #ov p{margin:.4rem 0}
  #ov .go{display:inline-block;margin-top:1rem;padding:.6rem 1.4rem;border:1px solid #f3efe6;border-radius:2px}
  #mini{position:fixed;right:14px;bottom:14px;width:220px;height:220px;border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.5);display:none;z-index:5;pointer-events:none}
  #hud{position:fixed;left:14px;top:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);font-size:1rem;pointer-events:none}
  #cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff;opacity:.7;pointer-events:none}
</style>
</head>
<body>
<div id="hud">Načítám mapu…</div>
<div id="cross"></div>
<canvas id="mini" width="440" height="440"></canvas>
<div id="ov"><div>
  <h1>Fügnerka</h1>
  <p>Liberec, v měřítku 1:1. Data z OpenStreetMap.</p>
  <p>W A S D – chůze &nbsp; Shift – rychleji &nbsp; myš – rozhlížení &nbsp; Esc – pauza &nbsp; M – přiblížení mapy</p>
  <p id="msg">Načítám data…</p>
  <span class="go" id="go" style="display:none">Klikni a jdi</span>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- souřadnice: střed mapy = Fügnerova ----------
const LON0 = 15.0573, LAT0 = 50.7657;
const KX = 111320 * Math.cos(LAT0 * Math.PI / 180), KY = 110574;
const P = c => [(c[0] - LON0) * KX, (c[1] - LAT0) * KY];   // [x východ, sever] v metrech

// ---------- scéna ----------
const scene = new THREE.Scene();
const SKY = 0xb8c9d6;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 120, 520);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f86, 0.85));
const sun = new THREE.DirectionalLight(0xfff2dd, 0.7);
sun.position.set(-120, 200, 80);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(4000, 4000),
  new THREE.MeshLambertMaterial({ color: 0x9da294 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// ---------- pomocné ----------
const mapB = [], mapR = [], mapA = [];
const colliders = [];   // {pts:[[x,z]...], minX,maxX,minZ,maxZ}
const segs = [];        // pojmenované cesty pro HUD
function hash(s) { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); }
function inPoly(x, z, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], zi = pts[i][1], xj = pts[j][0], zj = pts[j][1];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}

const WIDTH = { tertiary: 7, tertiary_link: 5, residential: 5.5, service: 3.5, living_street: 5, pedestrian: 6,
                footway: 2.2, steps: 1.8, path: 1.6, cycleway: 2.5, platform: 2.5, track: 2.5 };
const KIND = { tertiary: 'road', tertiary_link: 'road', residential: 'road', service: 'road', living_street: 'ped',
               pedestrian: 'ped', footway: 'foot', steps: 'foot', path: 'foot', cycleway: 'foot', platform: 'foot', track: 'foot' };
const STYLE = {
  road: { color: 0x4a4d52, y: 0.03 },
  ped:  { color: 0xc9bfae, y: 0.05 },
  foot: { color: 0xb3a999, y: 0.07 },
  fug:  { color: 0xd8b98a, y: 0.09 }      // Fügnerova zvýrazněná
};
const ribbons = { road: [], ped: [], foot: [], fug: [] };

function addRibbon(coords, kind, width, name) {
  const pts = coords.map(P);
  mapR.push({ pts: pts.map(q => [q[0], -q[1]]), w: width, kind });
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, an] = pts[i], [bx, bn] = pts[i + 1];
    const dx = bx - ax, dn = bn - an, len = Math.hypot(dx, dn);
    if (len < 0.01) continue;
    const nx = -dn / len * width / 2, nn = dx / len * width / 2;
    const y = STYLE[kind].y, arr = ribbons[kind];
    const A = [ax + nx, y, -(an + nn)], B = [ax - nx, y, -(an - nn)];
    const C = [bx + nx, y, -(bn + nn)], D = [bx - nx, y, -(bn - nn)];
    arr.push(...A, ...B, ...C, ...B, ...D, ...C);
    if (name) segs.push([ax, -an, bx, -bn, name]);
  }
}

// ---------- fasády (textury kreslené v prohlížeči, 1 buňka = 3,2 m = 1 patro) ----------
const MAXANI = renderer.capabilities.getMaxAnisotropy();
function speckle(g, S, a) {
  for (let i = 0; i < S * S / 6; i++) {
    g.fillStyle = 'rgba(90,90,90,' + (a * Math.random()) + ')';
    g.fillRect(Math.random() * S | 0, Math.random() * S | 0, 1, 1);
  }
}
function makeTex(kind) {
  const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const R = (col, x, y, w, h) => { g.fillStyle = col; g.fillRect(x * S, y * S, w * S, h * S); };
  if (kind === 'glass') {
    R('#8ea5b6', 0, 0, 1, 1); R('#d5dde3', 0, 0, 1, .04); R('#d5dde3', 0, 0, .03, 1); R('#a9bccb', .05, .05, .9, .4);
  } else {
    R('#ffffff', 0, 0, 1, 1); speckle(g, S, 0.22);
    if (kind === 'window') { R('#38465a', .3, .2, .4, .52); R('#d9d9d9', .28, .72, .44, .04); R('#cdd5dd', .495, .2, .01, .52); R('#e6e6e6', 0, 0, 1, .03); }
    if (kind === 'panel')  { R('#38465a', .12, .25, .3, .45); R('#38465a', .58, .25, .3, .45); R('#dcdcdc', 0, 0, 1, .04); R('#dcdcdc', 0, 0, .03, 1); }
    if (kind === 'ribbon') { R('#38465a', 0, .18, 1, .5); R('#e4e8ec', .24, .18, .015, .5); R('#e4e8ec', .5, .18, .015, .5); R('#e4e8ec', .75, .18, .015, .5); }
    if (kind === 'parking'){ R('#4a4d50', 0, .35, 1, .3); R('#e0e0e0', 0, 0, 1, .03); }
    if (kind === 'plain')  { R('#e4e4e4', 0, 0, 1, .02); R('#f0f0f0', 0, 0, .02, 1); }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1 / 3.2, -1 / 3.2); t.offset.set(0, 1 / 3.2);   // UV stěn jsou v metrech
  t.anisotropy = MAXANI;
  return t;
}
const TEX = {};
['window', 'glass', 'panel', 'ribbon', 'parking', 'plain'].forEach(k => TEX[k] = makeTex(k));

// ---------- textury cest a země (UV jsou v metrech, tile = velikost dlaždice v metrech) ----------
function makeGTex(kind, tile) {
  const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), rnd = Math.random;
  const grain = (base, amp) => {
    g.fillStyle = base; g.fillRect(0, 0, S, S);
    const im = g.getImageData(0, 0, S, S), d = im.data;
    for (let i = 0; i < d.length; i += 4) { const v = (rnd() - .5) * amp; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
    g.putImageData(im, 0, 0);
  };
  if (kind === 'road') {
    grain('#5b5e63', 34);
    for (let i = 0; i < 50; i++) { g.fillStyle = 'rgba(30,30,30,.25)'; g.fillRect(rnd() * S, rnd() * S, 2 + rnd() * 3, 1 + rnd() * 2); }
  } else if (kind === 'ped' || kind === 'foot') {
    const n = 4, cs = S / n;
    grain(kind === 'ped' ? '#d2c9b8' : '#bdb6a8', 14);
    for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) {
      g.fillStyle = 'rgba(' + (rnd() < .5 ? '0,0,0' : '255,255,255') + ',' + (.04 + rnd() * .08) + ')';
      g.fillRect(q * cs, r * cs, cs, cs);
    }
    g.strokeStyle = 'rgba(60,55,45,.55)'; g.lineWidth = 2; g.beginPath();
    for (let i = 0; i <= n; i++) { g.moveTo(i * cs, 0); g.lineTo(i * cs, S); g.moveTo(0, i * cs); g.lineTo(S, i * cs); }
    g.stroke();
  } else if (kind === 'fug') {   // žulová kostka
    grain('#6f685d', 20);
    const n = 8, cs = S / n;
    for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) {
      const t = 110 + rnd() * 70 | 0;
      g.fillStyle = 'rgb(' + (t + 14) + ',' + t + ',' + (t - 14) + ')';
      g.beginPath(); g.ellipse((q + .5) * cs, (r + .5) * cs, cs * .46, cs * .4, 0, 0, Math.PI * 2); g.fill();
    }
  } else {   // zem
    grain('#8d9a84', 30);
    for (let i = 0; i < 120; i++) { g.fillStyle = 'rgba(190,205,170,.35)'; g.fillRect(rnd() * S, rnd() * S, 1, 2 + rnd() * 3); }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / tile, 1 / tile); t.anisotropy = MAXANI;
  return t;
}
const GTEX = { road: makeGTex('road', 4), ped: makeGTex('ped', 2), foot: makeGTex('foot', 1.6), fug: makeGTex('fug', 1.6), ground: makeGTex('ground', 6) };
GTEX.ground.repeat.set(4000 / 6, 4000 / 6);   // země je jedna velká plocha s UV 0..1
ground.material = new THREE.MeshLambertMaterial({ map: GTEX.ground });

// střešní krytina (UV střech jsou v metrech, tile 2 m)
const ROOFTEX = (() => {
  const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, S, S);
  for (let r = 0; r < 8; r++) {
    g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(0, r * 16, S, 2);
    for (let k = 0; k < 4; k++) g.fillRect((r % 2) * 16 + k * 32, r * 16, 1, 16);
  }
  speckle(g, S, 0.3);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / 2, 1 / 2); t.anisotropy = MAXANI;
  return t;
})();

// ---------- minimapa ----------
const mini = document.getElementById('mini'), mg = mini.getContext('2d');
const BASE = 1.5, ZOOMS = [1.2, 0.45];   // px na metr (mapa je kreslená 2× kvůli ostrosti)
let zoomI = 0, mapBase = null, MB = { minX: 0, minZ: 0 };
function renderMapBase() {
  let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  const grow = pts => { for (const q of pts) { minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); minZ = Math.min(minZ, q[1]); maxZ = Math.max(maxZ, q[1]); } };
  mapB.forEach(grow); mapR.forEach(r => grow(r.pts));
  minX -= 30; minZ -= 30; maxX += 30; maxZ += 30;
  const W = Math.ceil((maxX - minX) * BASE), H = Math.ceil((maxZ - minZ) * BASE);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#dedbd0'; g.fillRect(0, 0, W, H);
  const T = q => [(q[0] - minX) * BASE, (q[1] - minZ) * BASE];
  const path = (pts, close) => { g.beginPath(); pts.forEach((q, i) => { const [x, y] = T(q); i ? g.lineTo(x, y) : g.moveTo(x, y); }); if (close) g.closePath(); };
  g.fillStyle = '#d3cab8'; mapA.forEach(a => { path(a, true); g.fill(); });
  g.lineCap = 'round'; g.lineJoin = 'round';
  const col = { road: ['#ffffff', '#b5b1a6'], ped: ['#f1ead9', '#c9c0ad'], foot: ['#e9e3d3', '#cfc8b7'], fug: ['#f4c27a', '#c98f3f'] };
  for (const pass of [0, 1]) for (const k of ['foot', 'road', 'ped', 'fug']) for (const r of mapR) {
    if (r.kind !== k) continue;
    path(r.pts, false);
    g.strokeStyle = col[k][pass === 0 ? 1 : 0];
    g.lineWidth = pass === 0 ? Math.max(r.w * BASE + 3, 4) : Math.max(r.w * BASE, 2);
    g.stroke();
  }
  g.fillStyle = '#b4ae9f'; g.strokeStyle = '#8b857a'; g.lineWidth = 1;
  mapB.forEach(b => { path(b, true); g.fill(); g.stroke(); });
  mapBase = c; MB = { minX, minZ };
  mini.style.display = 'block';
}
function drawMap() {
  const S = mini.width, R = S / 2, k = ZOOMS[zoomI] * 2 / BASE;
  mg.clearRect(0, 0, S, S);
  mg.save();
  mg.beginPath(); mg.arc(R, R, R - 3, 0, Math.PI * 2); mg.clip();
  mg.fillStyle = '#dedbd0'; mg.fillRect(0, 0, S, S);
  mg.translate(R, R); mg.rotate(yaw); mg.scale(k, k);   // směr pohledu je vždy nahoru
  mg.translate(-(player.x - MB.minX) * BASE, -(player.z - MB.minZ) * BASE);
  mg.drawImage(mapBase, 0, 0);
  mg.restore();
  mg.strokeStyle = '#fff'; mg.lineWidth = 6; mg.beginPath(); mg.arc(R, R, R - 3, 0, Math.PI * 2); mg.stroke();
  mg.fillStyle = '#e8472b'; mg.strokeStyle = '#fff'; mg.lineWidth = 3;
  mg.beginPath(); mg.moveTo(R, R - 26); mg.lineTo(R - 17, R + 20); mg.lineTo(R, R + 10); mg.lineTo(R + 17, R + 20); mg.closePath(); mg.fill(); mg.stroke();
  mg.fillStyle = '#2b2b2b'; mg.font = 'bold 30px Georgia'; mg.textAlign = 'center'; mg.textBaseline = 'middle';
  mg.fillText('S', R + Math.sin(yaw) * (R - 30), R - Math.cos(yaw) * (R - 30));
}

// ---------- BARVY BUDOV ----------
// Data z OpenStreetMap barvy nemají, proto jsou odhadnuté podle typu domu.
// Konkrétní dům přebarvíš tady: najdi jeho číslo (např. way/47488662 – klikni na budovu na openstreetmap.org),
// přidej řádek. color = barva fasády, roof = barva střechy, tex = window | glass | panel | ribbon | parking | plain,
// lv = počet pater.
const OVERRIDES = {
  'way/47488662':  { color: 0xe6d9a8, roof: 0x5b5f63 },                 // Liberecký zámek
  'way/48144344':  { color: 0xe8dcb4, roof: 0x5b5f63 },                 // Nový zámek
  'way/51844670':  { color: 0xf0eee6, tex: 'ribbon' },                  // Bývalý Baťa
  'way/51783913':  { color: 0xe9e4d6, tex: 'ribbon' },                  // Brouk a Babka (Pražská)
  'way/197991615': { color: 0xe8e6e0, tex: 'glass' },                   // OD Forum Liberec
  'way/102590538': { color: 0xf2f8ff, tex: 'glass' },                   // S tower
  'way/47488668':  { color: 0xa7a9a8, tex: 'parking' },                 // Parkovací dům
  'way/1285563593':{ color: 0xa7a9a8, tex: 'parking' },                 // Parkovací dům (Švédská)
  'way/84270541':  { color: 0xd6d3c8, tex: 'panel' },                   // Nisa
  'way/478696413': { color: 0xd6d3c8, tex: 'panel' },                   // Nisa
  'way/41188088':  { color: 0xd3cdbf },                                 // Dům kultury
  'way/197991686': { color: 0xd7c08e },                                 // Annahof
  'way/48183365':  { color: 0xd6b890 }                                  // Felberova 3
};
const OLD   = [0xe3d7b5, 0xd9c9a0, 0xe6c9b0, 0xc9d3c1, 0xd7d2c4, 0xe0cfa8, 0xcdbfa9, 0xdcb8a6];
const PANEL = [0xd8d6cd, 0xcfd3d0, 0xd9d2c0, 0xc9d0d6, 0xe0d8c8];

function styleFor(p) {
  const hs = hash(p['@id']);
  const lv = parseFloat(p['building:levels']) || 0;
  const flats = parseInt(p['building:flats']) || 0;
  const year = parseInt((p.start_date || '').slice(0, 4)) || 0;
  const modernUse = p.office || ['commercial', 'retail', 'civic'].includes(p.building);
  let st = { tex: 'window', color: OLD[hs % OLD.length], roof: 0x8c4a38, lv: lv || 4 };
  if (p.building === 'garage') st = { tex: 'plain', color: 0xb4b2aa, roof: 0x77797b, lv: 1 };
  else if (p.building === 'industrial' && !lv) st = { tex: 'plain', color: 0xc4c0b6, roof: 0x77797b, lv: 1 };
  else if (p.amenity === 'parking') st = { tex: 'parking', color: 0xa7a9a8, roof: 0x77797b, lv: lv || 6 };
  else if (flats >= 20 && lv >= 5 && !p.heritage) st = { tex: 'panel', color: PANEL[hs % PANEL.length], roof: 0x77797b, lv };
  else if (year >= 2000 && modernUse) st = { tex: 'glass', color: 0xffffff, roof: 0x77797b, lv: lv || 4 };
  else if (year >= 2000) st = { tex: 'window', color: 0xe9e6df, roof: 0x77797b, lv: lv || 4 };
  else if (p.heritage) st = { tex: 'window', color: OLD[hs % OLD.length], roof: 0x8c4a38, lv: lv || 4 };
  else if (lv > 5) st.roof = 0x77797b;
  if (p.building === 'construction') st = { tex: 'plain', color: 0xc9c7c0, roof: 0x77797b, lv: 4 };
  const ov = OVERRIDES[p['@id']]; if (ov) Object.assign(st, ov);
  for (const [tag, key] of [['building:colour', 'color'], ['roof:colour', 'roof']]) {
    if (p[tag]) { try { st[key] = new THREE.Color(p[tag]).getHex(); } catch (e) {} }
  }
  return st;
}

const wallMats = {}, roofMats = {};
function wallMat(tex, color) { const k = tex + color; return wallMats[k] || (wallMats[k] = new THREE.MeshLambertMaterial({ map: TEX[tex], color })); }
function roofMat(color) { return roofMats[color] || (roofMats[color] = new THREE.MeshLambertMaterial({ map: ROOFTEX, color })); }

function addBuilding(f) {
  const p = f.properties;
  const ring = f.geometry.coordinates[0].slice(0, -1).map(P);
  if (ring.length < 3) return;
  const st = styleFor(p);
  mapB.push(ring.map(q => [q[0], -q[1]]));
  const h = st.lv * 3.2;   // 1 patro = 3,2 m = 1 řada oken
  const shape = new THREE.Shape(ring.map(q => new THREE.Vector2(q[0], q[1])));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
  geo.rotateX(-Math.PI / 2);   // (x, sever) -> (x, nahoru, -sever)
  // skupina 0 = střecha/podlaha, skupina 1 = stěny
  scene.add(new THREE.Mesh(geo, [roofMat(st.roof), wallMat(st.tex, st.color)]));
  // kolize (OD Forum je průchozí – má pasáže, takže bez kolize)
  if (p.shop !== 'mall') {
    const xs = ring.map(q => q[0]), zs = ring.map(q => -q[1]);
    colliders.push({
      pts: ring.map(q => [q[0], -q[1]]),
      minX: Math.min(...xs), maxX: Math.max(...xs), minZ: Math.min(...zs), maxZ: Math.max(...zs)
    });
  }
}

function addFlatArea(f) {
  const ring = f.geometry.coordinates[0].slice(0, -1).map(P);
  if (ring.length < 3) return;
  mapA.push(ring.map(q => [q[0], -q[1]]));
  const geo = new THREE.ShapeGeometry(new THREE.Shape(ring.map(q => new THREE.Vector2(q[0], q[1]))));
  geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: GTEX.ped, side: THREE.DoubleSide }));
  m.position.y = 0.04;
  scene.add(m);
}

function build(data) {
  for (const f of data.features) {
    const p = f.properties, g = f.geometry;
    if (g.type === 'Polygon') {
      if (p.building) addBuilding(f);
      else if (p.highway === 'pedestrian') addFlatArea(f);
    } else if (g.type === 'LineString' && p.highway) {
      if (p.location === 'indoor' || p.tunnel || p.footway === 'crossing' && false) continue;
      if (p.highway === 'tertiary_link' && p.access === 'no') continue;
      const w = WIDTH[p.highway]; if (!w) continue;
      let kind = KIND[p.highway];
      if (p.name === 'Fügnerova') kind = 'fug';
      addRibbon(g.coordinates, kind, p.name === 'Fügnerova' ? Math.max(w, 5) : w, p.name);
    }
  }
  for (const k in ribbons) {
    if (!ribbons[k].length) continue;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(ribbons[k]);
    const nrm = new Float32Array(pos.length);
    for (let i = 1; i < nrm.length; i += 3) nrm[i] = 1;
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    const uv = new Float32Array(pos.length / 3 * 2);
    for (let i = 0, j = 0; i < pos.length; i += 3, j += 2) { uv[j] = pos[i]; uv[j + 1] = pos[i + 2]; }   // UV v metrech
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: GTEX[k], side: THREE.DoubleSide })));
  }
}

// ---------- hráč ----------
const EYE = 1.7;
const start = P([15.05712, 50.76578]);
const player = { x: start[0], z: -start[1] };
let yaw = 0.83, pitch = 0;
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyM') zoomI = (zoomI + 1) % ZOOMS.length; });
addEventListener('keyup', e => { keys[e.code] = false; });

function blockedAt(x, z) {
  const r = 0.4, probes = [[0, 0], [r, 0], [-r, 0], [0, r], [0, -r]];
  for (const c of colliders) {
    if (x < c.minX - r || x > c.maxX + r || z < c.minZ - r || z > c.maxZ + r) continue;
    for (const [ox, oz] of probes) if (inPoly(x + ox, z + oz, c.pts)) return true;
  }
  return false;
}
function move(dx, dz) {
  const stuck = blockedAt(player.x, player.z);   // když začneme uvnitř budovy, nechej se vyjít ven
  if (stuck || !blockedAt(player.x + dx, player.z + dz)) { player.x += dx; player.z += dz; return; }
  if (!blockedAt(player.x + dx, player.z)) player.x += dx;
  else if (!blockedAt(player.x, player.z + dz)) player.z += dz;
}

const ov = document.getElementById('ov'), hud = document.getElementById('hud');
ov.addEventListener('click', () => { if (ready) renderer.domElement.requestPointerLock(); });
document.addEventListener('pointerlockchange', () => {
  ov.style.display = document.pointerLockElement ? 'none' : 'flex';
});
document.addEventListener('mousemove', e => {
  if (!document.pointerLockElement) return;
  yaw -= e.movementX * 0.0022;
  pitch = Math.max(-1.45, Math.min(1.45, pitch - e.movementY * 0.0022));
});

let streetName = '', lastCheck = 0;
function updateStreet(t) {
  if (t - lastCheck < 400) return; lastCheck = t;
  let best = 14, name = '';
  for (const [ax, az, bx, bz, n] of segs) {
    const vx = bx - ax, vz = bz - az, l2 = vx * vx + vz * vz || 1;
    let u = ((player.x - ax) * vx + (player.z - az) * vz) / l2; u = Math.max(0, Math.min(1, u));
    const d = Math.hypot(player.x - (ax + u * vx), player.z - (az + u * vz));
    if (d < best) { best = d; name = n; }
  }
  streetName = name;
  hud.textContent = name || '';
}

// ---------- smyčka ----------
let ready = false, prev = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min((t - prev) / 1000, 0.1); prev = t;
  if (ready && document.pointerLockElement) {
    const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    const r = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    if (f || r) {
      const len = Math.hypot(f, r), sp = (keys.ShiftLeft || keys.ShiftRight ? 5 : 1.5) * dt / len;
      move((-Math.sin(yaw) * f + Math.cos(yaw) * r) * sp, (-Math.cos(yaw) * f - Math.sin(yaw) * r) * sp);
    }
    updateStreet(t);
  }
  if (ready && mapBase) drawMap();
  camera.position.set(player.x, EYE, player.z);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

// ---------- načtení dat ----------
const msg = document.getElementById('msg');
fetch('data.geojson')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(d => {
    build(d);
    renderMapBase();
    ready = true;
    msg.textContent = 'Mapa je načtená.';
    document.getElementById('go').style.display = 'inline-block';
    hud.textContent = '';
  })
  .catch(err => {
    msg.textContent = 'Nepodařilo se načíst data.geojson (' + err.message + '). Soubor musí ležet vedle index.html a stránka musí běžet z webu (GitHub Pages) nebo z lokálního serveru.';
  });
</script>
